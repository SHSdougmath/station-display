name: Build Station Display app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sort the files into an Android project
        env:
          ICON: 
        run: |
          set -e
          P=proj
          rm -rf $P
          mkdir -p $P/app/src/main/java/net/room309/stations $P/app/src/main/res/xml $P/app/src/main/res/mipmap-xxhdpi
          cp *.java $P/app/src/main/java/net/room309/stations/
          # Math engine: MathJax 2.7 with SVG output (works on old Android browsers)
          (cd /tmp && rm -rf package && npm pack mathjax@2.7.9 --silent && tar xzf mathjax-2.7.9.tgz)
          M=$P/app/src/main/assets/mathjax
          mkdir -p $M/config $M/jax/output/SVG/fonts $M/localization
          cp /tmp/package/MathJax.js $M/
          cp /tmp/package/config/TeX-AMS_SVG-full.js $M/config/
          cp /tmp/package/jax/output/SVG/config.js /tmp/package/jax/output/SVG/jax.js $M/jax/output/SVG/
          cp -r /tmp/package/jax/output/SVG/autoload $M/jax/output/SVG/
          cp -r /tmp/package/jax/output/SVG/fonts/TeX $M/jax/output/SVG/fonts/
          cp -r /tmp/package/extensions $M/
          cp -r /tmp/package/localization/en $M/localization/
          cp AndroidManifest.xml $P/app/src/main/
          cp device_admin.xml $P/app/src/main/res/xml/
          cp app-config.properties $P/
          echo "$ICON" | base64 -d > $P/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          if [ -f station-key.jks ]; then
            cp station-key.jks $P/
          else
            echo "::warning::station-key.jks is missing, so this build uses a temporary key. Upload station-key.jks so app updates install over the old version."
            keytool -genkeypair -keystore $P/station-key.jks -storepass room309stations -keypass room309stations -alias station -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Station Display, O=Room 309"
          fi

          cat > $P/settings.gradle <<'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "StationDisplay"
          include ':app'
          GRADLE

          cat > $P/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE

          printf 'org.gradle.jvmargs=-Xmx2g\nandroid.nonTransitiveRClass=true\n' > $P/gradle.properties

          cat > $P/app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          def cfg = new Properties()
          def cfgFile = rootProject.file('app-config.properties')
          if (cfgFile.exists()) { cfgFile.withInputStream { cfg.load(it) } }
          def q = { String s -> '"' + (s ?: '').trim().replace('\\', '\\\\').replace('"', '\\"') + '"' }
          def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

          android {
              namespace 'net.room309.stations'
              compileSdk 34

              defaultConfig {
                  applicationId 'net.room309.stations'
                  minSdk 23
                  targetSdk 34
                  versionCode runNumber
                  versionName "1." + runNumber
                  buildConfigField 'String', 'SERVER_URL', q(cfg.getProperty('SERVER_URL', ''))
                  buildConfigField 'String', 'SETTINGS_PIN', q(cfg.getProperty('SETTINGS_PIN', '3090'))
              }

              buildFeatures { buildConfig true }

              signingConfigs {
                  shared {
                      storeFile rootProject.file('station-key.jks')
                      storePassword 'room309stations'
                      keyAlias 'station'
                      keyPassword 'room309stations'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.shared
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          GRADLE

      - name: Build the APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp proj/app/build/outputs/apk/release/app-release.apk StationDisplay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StationDisplay-apk
          path: StationDisplay.apk
